<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sample UI versus token evidence</title>
  <desc id="desc">Side-by-side overview showing a rendered sample interface and the design tokens used to generate it.</desc>
  <rect width="1280" height="720" fill="#F7F8FA"/>
  <rect x="44" y="44" width="1192" height="632" rx="18" fill="#FFFFFF" stroke="#D4D6D8" stroke-width="2"/>

  <text x="84" y="104" fill="#232E3D" font-family="Arial, sans-serif" font-size="32" font-weight="700">Sample UI</text>
  <text x="700" y="104" fill="#232E3D" font-family="Arial, sans-serif" font-size="32" font-weight="700">Token + MCP Evidence</text>

  <rect x="84" y="138" width="536" height="482" rx="10" fill="#232E3D"/>
  <rect x="84" y="138" width="536" height="482" rx="10" stroke="#000000" stroke-opacity="0.18"/>
  <rect x="112" y="166" width="60" height="60" fill="#006EB5"/>
  <text x="132" y="203" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="700">CT</text>
  <text x="190" y="204" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="24" font-weight="700">Context Tokens</text>
  <rect x="112" y="260" width="448" height="112" fill="#111821"/>
  <text x="136" y="300" fill="#EE402D" font-family="Arial, sans-serif" font-size="18" font-weight="700">CONTEXTUAL TOKEN STUDIO TRIAL</text>
  <text x="136" y="352" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="46" font-weight="800">One control surface,</text>
  <text x="136" y="406" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="46" font-weight="800">two theme contexts.</text>
  <text x="136" y="462" fill="#D4D6D8" font-family="Arial, sans-serif" font-size="20">Light, dark, universal, primitive,</text>
  <text x="136" y="492" fill="#D4D6D8" font-family="Arial, sans-serif" font-size="20">and responsive breakpoint tokens.</text>
  <rect x="136" y="532" width="170" height="48" fill="#D12800"/>
  <text x="168" y="563" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17" font-weight="700">Open readiness</text>
  <rect x="326" y="532" width="170" height="48" fill="transparent" stroke="#FFFFFF" stroke-width="2"/>
  <text x="352" y="563" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17" font-weight="700">Inspect handoff</text>

  <rect x="700" y="138" width="496" height="482" rx="10" fill="#FFFFFF" stroke="#D4D6D8" stroke-width="2"/>
  <rect x="732" y="172" width="190" height="48" fill="#F7F7F7" stroke="#D4D6D8"/>
  <text x="758" y="203" fill="#006EB5" font-family="Arial, sans-serif" font-size="18" font-weight="700">191 tokens loaded</text>
  <rect x="944" y="172" width="178" height="48" fill="#F7F7F7" stroke="#D4D6D8"/>
  <text x="972" y="203" fill="#006EB5" font-family="Arial, sans-serif" font-size="18" font-weight="700">HTTP + stdio</text>

  <text x="732" y="266" fill="#232E3D" font-family="Arial, sans-serif" font-size="20" font-weight="700">Resolved token examples</text>
  <rect x="732" y="292" width="408" height="58" fill="#F7F7F7"/>
  <rect x="748" y="308" width="26" height="26" fill="#D12800"/>
  <text x="792" y="329" fill="#232E3D" font-family="Arial, sans-serif" font-size="17">light/color.action.primary.default</text>
  <text x="1058" y="329" fill="#677383" font-family="Arial, sans-serif" font-size="17">#D12800</text>
  <rect x="732" y="366" width="408" height="58" fill="#F7F7F7"/>
  <rect x="748" y="382" width="26" height="26" fill="#232E3D"/>
  <text x="792" y="403" fill="#232E3D" font-family="Arial, sans-serif" font-size="17">dark/color.background.default</text>
  <text x="1058" y="403" fill="#677383" font-family="Arial, sans-serif" font-size="17">#232E3D</text>
  <rect x="732" y="440" width="408" height="58" fill="#F7F7F7"/>
  <rect x="748" y="456" width="26" height="26" fill="#D4D6D8"/>
  <text x="792" y="477" fill="#232E3D" font-family="Arial, sans-serif" font-size="17">contextual disabled alias</text>
  <text x="1044" y="477" fill="#677383" font-family="Arial, sans-serif" font-size="17">current set</text>

  <text x="732" y="544" fill="#232E3D" font-family="Arial, sans-serif" font-size="20" font-weight="700">Generated CSS contract</text>
  <rect x="732" y="566" width="408" height="34" fill="#232E3D"/>
  <text x="752" y="589" fill="#FFFFFF" font-family="monospace" font-size="16">var(--light_u002f_color-color-action-primary-disabled)</text>
</svg>
