# Sample Secret for ds-mcp-server.
#
# DO NOT commit a real secret with real values. This file is .example.yaml
# specifically to make that obvious. In production:
#   - Use SealedSecrets, External Secrets Operator, or your cloud's secret
#     manager to materialize this secret at deploy time.
#   - Or `kubectl create secret generic ds-mcp-server-env --from-env-file=...`
#     against a file that lives outside the repo.

apiVersion: v1
kind: Secret
metadata:
  name: ds-mcp-server-env
type: Opaque
stringData:
  # Required when DS_MCP_SOURCE_MODE=git
  DS_MCP_SOURCE_URL: "https://github.com/your-org/design-system.git"

  # Optional: fine-scoped GitHub PAT for HTTPS clones of private repos.
  # Embedded as basic auth on clone/fetch; never logged.
  GIT_AUTH_TOKEN: "ghp_REPLACE_ME"

  # SHA-256 hex digests (64 hex chars each), comma-separated. Each digest
  # corresponds to one team API key.
  # To generate: printf '%s' '<your-key>' | shasum -a 256
  DS_MCP_API_KEYS: "REPLACE_WITH_SHA256_HEX,ANOTHER_SHA256_HEX"

  # Bearer token for POST /admin/refresh. Random, distinct from API keys.
  # Generate: openssl rand -hex 32
  DS_MCP_ADMIN_TOKEN: "REPLACE_WITH_RANDOM_HEX"
